
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Rex · Morpeko PTE Exam Countdown</title>
<style>
  :root{font-family:ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;color:#514039;background:transparent;color-scheme:light}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:transparent}
  body{display:flex;justify-content:center;align-items:flex-start}
  .card{position:relative;container-type:inline-size;width:350px;max-width:100%;aspect-ratio:796/734;overflow:hidden;background:#fffaf3;border-radius:8.5%;isolation:isolate}
  .art{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;user-select:none}
  /* Both count and label sit within the illustrated cream circle. */
  .counter{position:absolute;left:30.6%;top:23.0%;width:38.8%;height:31.4%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;pointer-events:none;font-variant-numeric:tabular-nums;z-index:2}
  .num{font-family:ui-rounded,"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;font-size:17cqw;font-weight:850;line-height:1;letter-spacing:-.04em;color:#524239;white-space:nowrap;max-width:100%;display:block;transform:translateX(.45cqw)}
  .num.many{font-size:16.7cqw;letter-spacing:-.045em}
  .num.very-many{font-size:13cqw}
  .unit{font-family:ui-rounded,"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;font-size:5.5cqw;font-weight:800;line-height:1.05;letter-spacing:.05em;color:#7e6554;margin-top:1.2cqw}
  /* Use ONLY the calendar icon already drawn on the left of the illustration. */
  .date-shell{position:absolute;left:9%;top:81.1%;width:82%;height:15.5%;z-index:3}
  .date-button{position:absolute;inset:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;border:0;background:transparent;color:#765d4d;font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;font-size:5.8cqw;font-weight:750;white-space:nowrap;cursor:pointer;padding:0}
  .date-text{position:absolute;left:24%;width:54%;top:50%;transform:translateY(-50%);text-align:center;line-height:1.1}
  .date-button:focus-visible,.close:focus-visible,.nav:focus-visible,.grid-days button:focus-visible,.picker select:focus-visible{outline:2px solid #ad7855;outline-offset:1px;border-radius:7px}
  /* Independent calendar: avoids blocked showPicker() in cross-origin Notion embeds. */
  .picker[hidden]{display:none}
  .picker{position:absolute;z-index:8;top:9%;left:5%;width:90%;height:83%;border:1px solid #e7cfb5;border-radius:14px;background:#fffaf2;box-shadow:0 6px 22px #62462c35;padding:2.4cqw;display:flex;flex-direction:column;gap:1cqw}
  .picker-head{display:flex;align-items:center;justify-content:space-between;gap:1cqw}
  .picker-title{font-size:3.9cqw;font-weight:800;color:#805737}
  .close,.nav{border:0;background:#f3e3d0;color:#845a3f;border-radius:6px;cursor:pointer;display:grid;place-items:center;width:7.5cqw;height:7.5cqw;min-width:19px;min-height:19px;font-size:4.8cqw;line-height:1}
  .picker-controls{display:flex;align-items:center;justify-content:space-between;gap:1cqw}
  .picker select{flex:1;min-width:0;height:7.6cqw;min-height:19px;padding:0 1.3cqw;border:1px solid #e4cab1;border-radius:6px;color:#6a4b37;background:#fffdf8;font-size:3.7cqw;font-weight:700}
  .weekdays,.grid-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.4cqw;text-align:center}
  .weekdays{color:#a78c72;font-size:3.2cqw;font-weight:700}
  .grid-days{flex:1;grid-template-rows:repeat(6,minmax(0,1fr));min-height:0}
  .grid-days button{border:0;background:transparent;color:#5c4939;border-radius:6px;cursor:pointer;font:700 3.6cqw ui-rounded,system-ui,sans-serif;min-width:0;min-height:0;padding:0}
  .grid-days button:hover{background:#f0ddc5}
  .grid-days button.other{color:#c4b4a5}
  .grid-days button.selected{background:#b78258;color:white}
  .grid-days button.today{box-shadow:inset 0 0 0 1px #b78258}
  .picker-foot{font-size:2.8cqw;color:#9d7e64;text-align:center;line-height:1.1}
</style>
</head>

<script>
(()=>{
  'use strict';
  const KEY='rex-pte-exam-countdown-date-v1';
  const $=id=>document.getElementById(id);
  const days=$('days'),unit=$('unit'),dateDisplay=$('dateDisplay'),dateBtn=$('dateBtn');
  const picker=$('picker'),calendar=$('calendar'),month=$('month'),year=$('year');
  const today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
  const valid=s=>{
    if(!/^\d{4}-\d{2}-\d{2}$/.test(s||''))return false;
    const [y,m,d]=s.split('-').map(Number); const dt=new Date(y,m-1,d);
    return dt.getFullYear()===y&&dt.getMonth()===m-1&&dt.getDate()===d;
  };
  const dayNumber=s=>{const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)/86400000};
  const formatDate=s=>{const [y,m,d]=s.split('-').map(Number);return String(d).padStart(2,'0')+'/'+String(m).padStart(2,'0')+'/'+y};
  const iso=(y,m,d)=>[y,String(m).padStart(2,'0'),String(d).padStart(2,'0')].join('-');
  let selected='';
  try{const saved=localStorage.getItem(KEY);if(valid(saved))selected=saved}catch(e){}
  let displayMonth,displayYear;
  const initial=selected||today();
  [displayYear,displayMonth]=initial.split('-').map(Number);
  function render(){
    dateDisplay.textContent=valid(selected)?formatDate(selected):'Select exam date';
    if(!valid(selected)){days.textContent='—';unit.textContent='DAYS'}
    else{const remain=Math.max(0,dayNumber(selected)-dayNumber(today()));days.textContent=remain.toLocaleString('en-AU');unit.textContent=remain===1?'DAY':'DAYS'}
    days.classList.toggle('many',days.textContent.length>=3);
    days.classList.toggle('very-many',days.textContent.length>=4);
  }
  for(let i=1;i<=12;i++){const option=document.createElement('option');option.value=String(i);option.textContent=new Intl.DateTimeFormat('en-AU',{month:'short'}).format(new Date(2026,i-1,1));month.append(option)}
  const yearStart=new Date().getFullYear()-2;
  for(let y=yearStart;y<=yearStart+25;y++){const option=document.createElement('option');option.value=String(y);option.textContent=String(y);year.append(option)}
  function drawCalendar(){
    month.value=String(displayMonth);year.value=String(displayYear);
    calendar.replaceChildren();
    const offset=new Date(displayYear,displayMonth-1,1).getDay();
    const todayDate=today();
    for(let i=0;i<42;i++){
      const d=new Date(displayYear,displayMonth-1,1-offset+i),value=iso(d.getFullYear(),d.getMonth()+1,d.getDate());
      const btn=document.createElement('button');btn.type='button';btn.textContent=String(d.getDate());btn.title=value;
      if(d.getMonth()!==displayMonth-1)btn.classList.add('other');
      if(value===selected)btn.classList.add('selected');
      if(value===todayDate)btn.classList.add('today');
      btn.setAttribute('aria-label',formatDate(value));
      btn.addEventListener('click',()=>{
        selected=value;
        try{localStorage.setItem(KEY,selected)}catch(e){}
        render();closePicker();
      });
      calendar.append(btn);
    }
  }
  function openPicker(){
    const date=valid(selected)?selected:today();
    [displayYear,displayMonth]=date.split('-').map(Number);
    drawCalendar();picker.hidden=false;dateBtn.setAttribute('aria-expanded','true');$('closeBtn').focus();
  }
  function closePicker(){picker.hidden=true;dateBtn.setAttribute('aria-expanded','false');dateBtn.focus()}
  function moveMonth(delta){const date=new Date(displayYear,displayMonth-1+delta,1);displayYear=date.getFullYear();displayMonth=date.getMonth()+1;drawCalendar()}
  dateBtn.addEventListener('click',openPicker);
  $('closeBtn').addEventListener('click',closePicker);
  $('prev').addEventListener('click',()=>moveMonth(-1));
  $('next').addEventListener('click',()=>moveMonth(1));
  month.addEventListener('change',()=>{displayMonth=Number(month.value);drawCalendar()});
  year.addEventListener('change',()=>{displayYear=Number(year.value);drawCalendar()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!picker.hidden)closePicker()});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
  window.addEventListener('focus',render);
  setInterval(render,30000);
  render();
})();
</script>
</body>
</html>
