
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Mini Calendar</title>
<style>
  :root{--paper:#fffaf2;--ink:#4d4039;--muted:#a28f82;--copper:#bd673d;--line:#efdfd0;--gold:#d9954c}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:transparent;font-family:Inter,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}
  body{padding:5px;display:flex;justify-content:center;align-items:flex-start}
  .widget{position:relative;width:100%;max-width:410px;overflow:hidden;border:1px solid #e9d7c5;border-radius:23px;background:var(--paper);box-shadow:0 9px 27px rgba(91,57,35,.07)}
  .hero{position:relative;height:123px;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse at 50% -30%,#fffdf3 4%,transparent 71%),linear-gradient(115deg,#f5d5b1,#fce9cc 48%,#e9c8a4)}
  .hero::after{content:"";position:absolute;z-index:0;inset:auto 0 0;height:24px;background:linear-gradient(0deg,var(--paper),transparent);pointer-events:none}
  .glow{position:absolute;z-index:0;border:1px solid rgba(255,255,255,.52);border-radius:50%;width:150px;height:150px;top:-70px;left:calc(50% - 75px)}
  .hero-text{position:absolute;inset:30px 100px auto;z-index:3;text-align:center;white-space:nowrap;pointer-events:none}
  .eyebrow{color:#9e6b50;font-size:9px;letter-spacing:2.3px;font-weight:700}
  .month{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:normal;font-size:26px;line-height:1.25;letter-spacing:-.6px;margin-top:7px;color:#644935}
  .year{font-size:11px;letter-spacing:2px;color:#9a7055;margin-top:1px}
  .mascot{position:absolute;z-index:1;top:4px;width:107px;height:119px;object-fit:cover;pointer-events:none;filter:saturate(.82) sepia(.13)}
  .mascot.left{left:-10px;object-position:center 49%;-webkit-mask-image:radial-gradient(ellipse 49% 49% at 50% 48%,#000 55%,transparent 100%);mask-image:radial-gradient(ellipse 49% 49% at 50% 48%,#000 55%,transparent 100%)}
  .mascot.right{right:-7px;object-position:center 48%;-webkit-mask-image:radial-gradient(ellipse 49% 49% at 50% 48%,#000 56%,transparent 100%);mask-image:radial-gradient(ellipse 49% 49% at 50% 48%,#000 56%,transparent 100%)}
  .leaf{position:absolute;z-index:2;width:26px;height:29px;fill:#c67d42;opacity:.82;pointer-events:none;filter:drop-shadow(0 1px 1px #c77a4852)}
  .leaf.one{left:92px;top:8px;transform:rotate(-33deg) scale(.68)}
  .leaf.two{right:91px;top:77px;transform:rotate(33deg) scale(.52);fill:#a86d49}
  .leaf.three{left:67px;top:88px;transform:rotate(-71deg) scale(.42);fill:#d69b57}
  .toolbar{display:flex;justify-content:center;align-items:center;gap:13px;padding:8px 12px 7px;border-bottom:1px solid var(--line);margin:0 17px}
  .toolbar button{display:grid;place-items:center;border:0;border-radius:9px;background:transparent;color:#95735b;width:27px;height:26px;cursor:pointer;font-size:21px;line-height:1;transition:background .15s,color .15s}
  .toolbar button:hover,.toolbar button:focus-visible{background:#f3e1d0;color:#975b3a;outline:none}
  .toolbar .today-button{width:auto;min-width:79px;padding:0 10px;font-size:10px;font-weight:700;letter-spacing:1.5px;border:1px solid #ead8c5;border-radius:15px;background:#fff8ec;color:#976e51}
  .calendar{padding:10px 15px 5px}
  .weekdays,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center}
  .weekdays{padding:0 2px 4px}
  .weekdays span{color:#a38e7f;font-size:10px;font-weight:700;line-height:24px}
  .weekdays span:nth-child(n+6){color:#c18c6c}
  .days{grid-auto-rows:37px;align-items:center;justify-items:center}
  .date{position:relative;width:33px;height:33px;border:1px solid transparent;border-radius:50%;display:flex;justify-content:center;align-items:center;background:transparent;color:#55483c;font-family:inherit;font-size:12px;font-weight:550;cursor:pointer;transition:background .14s,color .14s,transform .14s}
  .date:hover,.date:focus-visible{background:#f4e3d1;outline:none;transform:translateY(-1px)}
  .date.other{color:#c8b9ab}
  .date.today{background:#bb7247;color:#fffaf3;box-shadow:0 3px 8px #bd754a3b;font-weight:800}
  .date.selected:not(.today){border-color:#b96f46;background:#f7e7d5;color:#9b5531;font-weight:800}
  .date.selected.today{outline:2px solid #ebc79f;outline-offset:2px}
  .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 18px 14px;padding:9px 12px 0;border-top:1px solid var(--line);font-size:10px;color:#ab8163;letter-spacing:.45px}
  .foot strong{color:#a26441;font-weight:700}
  .foot .season{white-space:nowrap;letter-spacing:1.3px;font-size:9px;font-weight:700}
  @media(max-width:340px){.mascot{width:91px;height:109px}.hero-text{inset-inline:79px}.month{font-size:23px}.leaf.one{left:69px}.leaf.two{right:69px}.calendar{padding-inline:8px}.date{width:31px;height:31px}}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
(() => {
  'use strict';
  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const weekdays = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const grid = document.getElementById('dayGrid');
  const today = new Date();
  today.setHours(0,0,0,0);
  let viewing = new Date(today.getFullYear(), today.getMonth(), 1);
  let selected = new Date(today);
  const equals = (a,b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  const localDate = (d) => `${weekdays[d.getDay()]}, ${monthNames[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
  function render() {
    const y = viewing.getFullYear(), m = viewing.getMonth();
    document.getElementById('monthText').textContent = monthNames[m];
    document.getElementById('yearText').textContent = y;
    grid.replaceChildren();
    const firstWeekday = (new Date(y,m,1).getDay()+6)%7;
    const count = new Date(y,m+1,0).getDate();
    const cells = firstWeekday + count <= 35 ? 35 : 42;
    for(let i=0;i<cells;i++) {
      const d = new Date(y,m,i-firstWeekday+1);
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'date' + (d.getMonth() !== m ? ' other' : '') + (equals(d,today) ? ' today' : '') + (equals(d,selected) ? ' selected' : '');
      b.textContent = d.getDate();
      b.setAttribute('role','gridcell');
      b.setAttribute('aria-label',localDate(d) + (equals(d,today) ? ', today' : ''));
      b.setAttribute('aria-selected',equals(d,selected) ? 'true' : 'false');
      b.addEventListener('click',() => { selected = d; viewing = new Date(d.getFullYear(),d.getMonth(),1); render(); });
      grid.appendChild(b);
    }
    document.getElementById('dateLabel').innerHTML = `<strong>${monthNames[selected.getMonth()]} ${selected.getDate()}</strong> · ${weekdays[selected.getDay()]}`;
  }
  document.getElementById('prev').addEventListener('click',() => { viewing = new Date(viewing.getFullYear(), viewing.getMonth()-1, 1); render(); });
  document.getElementById('next').addEventListener('click',() => { viewing = new Date(viewing.getFullYear(), viewing.getMonth()+1, 1); render(); });
  document.getElementById('jumpToday').addEventListener('click',() => { const now = new Date(); now.setHours(0,0,0,0); selected = now; viewing = new Date(now.getFullYear(),now.getMonth(),1); render(); });
  render();
})();
</script>
